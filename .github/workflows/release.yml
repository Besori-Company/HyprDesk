name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml is gitignored, so CI needs the target dir here / .cargo/config.toml está en .gitignore, así que CI necesita el directorio aquí
  CARGO_TARGET_DIR: .buildcache
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
  AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            cross: true

    steps:
      - name: Checkout / Clonar repositorio
        uses: actions/checkout@v4

      - name: Install Rust toolchain / Instalar cadena de herramientas Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo / Caché de Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .buildcache
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Install build dependencies / Instalar dependencias de compilación
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config libvulkan-dev libwayland-dev \
            libxkbcommon-dev libssl-dev

      - name: Install cross-compiler for aarch64 / Compilador cruzado para aarch64
        if: matrix.cross
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build / Compilar
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p dist
          cp .buildcache/${{ matrix.target }}/release/hyprdesk \
             dist/hyprdesk-linux-${{ matrix.arch }}

      - name: Build .deb (x86_64 only) / Crear paquete .deb
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y rpm
          sudo gem install fpm --no-document -q
          VERSION="${GITHUB_REF_NAME#v}"
          fpm -s dir -t deb \
            -n hyprdesk -v "$VERSION" --iteration 1 \
            --description "Desktop control panel for Hyprland — brightness, night mode, monitors and more" \
            --url "https://github.com/Besori-Company/HyprDesk" \
            --license "MIT + Commons Clause" \
            --maintainer "Besori <https://github.com/Besori-Company>" \
            --category "utils" \
            --deb-recommends "brightnessctl" \
            --deb-recommends "hyprsunset | wlsunset" \
            "dist/hyprdesk-linux-x86_64=/usr/bin/hyprdesk" \
            "hyprdesk/assets/icons/hyprdesk.png=/usr/share/icons/hicolor/256x256/apps/hyprdesk.png"
          mv hyprdesk_*.deb dist/hyprdesk_amd64.deb

      - name: Build .rpm (x86_64 only) / Crear paquete .rpm
        if: matrix.arch == 'x86_64'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          fpm -s dir -t rpm \
            -n hyprdesk -v "$VERSION" --iteration 1 \
            --description "Desktop control panel for Hyprland — brightness, night mode, monitors and more" \
            --url "https://github.com/Besori-Company/HyprDesk" \
            --license "MIT + Commons Clause" \
            --maintainer "Besori <https://github.com/Besori-Company>" \
            --rpm-summary "Desktop control panel for Hyprland" \
            "dist/hyprdesk-linux-x86_64=/usr/bin/hyprdesk" \
            "hyprdesk/assets/icons/hyprdesk.png=/usr/share/icons/hicolor/256x256/apps/hyprdesk.png"
          mv hyprdesk-*.rpm dist/hyprdesk_x86_64.rpm

      - name: Upload artifacts / Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: hyprdesk-${{ matrix.arch }}
          path: dist/

  release:
    name: Create GitHub Release / Crear release en GitHub
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts / Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release / Crear release
        uses: softprops/action-gh-release@v2
        with:
          name: "HyprDesk ${{ github.ref_name }}"
          body: |
            ## Installation / Instalación

            **Quick install (all distros):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Besori-Company/HyprDesk/main/scripts/install.sh | bash
            ```

            **Arch / Manjaro (AUR):**
            ```bash
            yay -S hyprdesk
            ```

            **Debian / Ubuntu:**
            ```bash
            curl -LO https://github.com/Besori-Company/HyprDesk/releases/download/${{ github.ref_name }}/hyprdesk_amd64.deb
            sudo dpkg -i hyprdesk_amd64.deb
            ```

            **Fedora / RHEL:**
            ```bash
            sudo dnf install https://github.com/Besori-Company/HyprDesk/releases/download/${{ github.ref_name }}/hyprdesk_x86_64.rpm
            ```
          files: dist/**
          draft: false
          prerelease: false
