[package]
name = "hyprdesk"
version = "1.0.4"
edition = "2024"
description = "Desktop control panel for Hyprland — brightness, night mode, monitors and more"
license-file = "LICENSE.md"
repository = "https://github.com/Besori-Company/HyprDesk"

[[bin]]
name = "hyprdesk"
path = "hyprdesk/main.rs"

[dependencies]
iced    = { version = "0.14", features = ["canvas", "image", "svg", "tokio"] }
rfd     = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
regex      = "1"
tokio      = { version = "1", features = ["time"] }
image      = { version = "0.24", default-features = false, features = ["png", "jpeg", "webp"] }
